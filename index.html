<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BTC Live</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #111111;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                   "Helvetica Neue", Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 700px;
    }

    .card {
      background: #1c1c1e;
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 8px 30px rgba(0,0,0,.35);
    }

    h1 {
      margin: 0;
      font-size: 22px;
    }

    .price {
      font-size: 48px;
      font-weight: 700;
      margin-top: 15px;
      letter-spacing: -1px;
    }

    .status {
      color: #a1a1a6;
      font-size: 14px;
      margin-top: 8px;
      margin-bottom: 20px;
    }

    canvas {
      width: 100%;
      height: 280px;
      background: #111111;
      border-radius: 14px;
      display: block;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 14px;
      border: 0;
      border-radius: 13px;
      background: white;
      color: black;
      font-size: 17px;
      font-weight: 600;
    }

    .source {
      margin-top: 15px;
      color: #777;
      font-size: 12px;
      line-height: 1.4;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="card">

    <h1>₿ BTC / USD</h1>

    <div id="price" class="price">
      Loading...
    </div>

    <div id="status" class="status">
      Connecting to Coinbase...
    </div>

    <canvas id="chart" width="900" height="500"></canvas>

    <button onclick="updatePrice()">
      Refresh Now
    </button>

    <div class="source">
      Coinbase BTC/USD price • Automatically refreshes every 10 seconds.
    </div>

  </div>

</div>

<script>

const prices = [];

const canvas = document.getElementById("chart");
const ctx = canvas.getContext("2d");

async function updatePrice() {

  const priceElement = document.getElementById("price");
  const statusElement = document.getElementById("status");

  try {

    const response = await fetch(
      "https://api.coinbase.com/v2/prices/BTC-USD/spot?time=" + Date.now(),
      {
        cache: "no-store"
      }
    );

    if (!response.ok) {
      throw new Error("Price request failed");
    }

    const data = await response.json();

    const price = Number(data.data.amount);

    if (!Number.isFinite(price)) {
      throw new Error("Invalid price");
    }

    prices.push(price);

    // Keep the most recent 60 readings
    if (prices.length > 60) {
      prices.shift();
    }

    priceElement.textContent =
      "$" +
      price.toLocaleString("en-US", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });

    statusElement.textContent =
      "Updated " +
      new Date().toLocaleTimeString() +
      " • Next update in 10 seconds";

    drawChart();

  } catch (error) {

    statusElement.textContent =
      "Unable to load BTC price. Tap Refresh Now to retry.";

  }

}


function drawChart() {

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  if (prices.length < 2) {
    return;
  }

  const padding = 40;

  const minimum = Math.min(...prices);
  const maximum = Math.max(...prices);

  const range =
    (maximum - minimum) || 1;

  ctx.beginPath();

  prices.forEach((price, index) => {

    const x =
      padding +
      index *
      (canvas.width - padding * 2) /
      (prices.length - 1);

    const y =
      canvas.height -
      padding -
      ((price - minimum) / range) *
      (canvas.height - padding * 2);

    if (index === 0) {
      ctx.moveTo(x, y);
    } else {
      ctx.lineTo(x, y);
    }

  });

  ctx.lineWidth = 4;
  ctx.strokeStyle = "white";
  ctx.lineJoin = "round";
  ctx.lineCap = "round";

  ctx.stroke();

}


// Load immediately
updatePrice();

// Refresh every 10 seconds
setInterval(updatePrice, 10000);

</script>

</body>
</html>
